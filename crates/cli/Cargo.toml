[package]
name = "rhizo-cli"
description = "Command-line interface for rhizo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rhizo-core.workspace = true
rhizo-lang.workspace = true
rhizo-layout.workspace = true
rhizo-render.workspace = true
rhizo-interop.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde_json.workspace = true

[[bin]]
name = "rhizo"
path = "src/main.rs"
