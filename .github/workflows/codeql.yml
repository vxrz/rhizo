# CodeQL code scanning: Rust with the security-extended query suite, and the
# GitHub Actions workflows themselves. Results: Security → Code scanning (public
# repositories); the SARIF files are kept as artifacts either way.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 3' # Wednesdays 04:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Code scanning on a private repo needs GitHub Advanced Security; runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # workflow run information for private repositories
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never # uploaded below, without failing where code scanning is not available
          output: codeql-results
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('codeql-results/*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: codeql-results
          category: /language:${{ matrix.language }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: ignore
          retention-days: 30
