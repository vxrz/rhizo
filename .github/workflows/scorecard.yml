# OpenSSF Scorecard: checks supply-chain practices (pinned dependencies, token
# permissions, branch protection, code review, …) and publishes the score for
# the badge at https://scorecard.dev once the repository is public.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '29 6 * * 1' # Mondays 06:29 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    # Scorecard only works on public repos.
    if: ${{ !github.event.repository.private }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload
      id-token: write # publishing the results (public repositories only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing only works for public repositories (and feeds the scorecard.dev badge)
          publish_results: ${{ github.event.repository.private == false }}
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('scorecard.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scorecard-report
          path: scorecard.sarif
          if-no-files-found: ignore
          retention-days: 30
