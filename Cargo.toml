[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rhizo-core = { path = "crates/core" }
rhizo-lang = { path = "crates/lang" }
rhizo-layout = { path = "crates/layout" }
rhizo-render = { path = "crates/render" }
rhizo-interop = { path = "crates/interop" }

indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
schemars = { version = "1.2", features = ["indexmap2"] }
thiserror = "2.0"
miette = "7.6"
kdl = "6.7"
roxmltree = "0.20"
clap = { version = "4.6", features = ["derive"] }
# usvg/resvg are pinned to the version krilla-svg is built against so only one
# usvg ends up in the tree.
usvg = "0.47"
resvg = "0.47"
krilla = "0.8"
krilla-svg = "0.8"
ttf-parser = "0.25"
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
