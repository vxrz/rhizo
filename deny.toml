# cargo-deny: known vulnerabilities, licences, duplicate crates and sources.
# Runs in .github/workflows/security.yml (push, pull request, weekly). Locally: `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisories, including unmaintained and yanked crates. Accept a finding only with a
# reason here: ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "…" }]
ignore = [
    # Unmaintained, no known vulnerability. Pulled in by usvg/resvg and krilla (SVG, PDF,
    # text shaping); goes away when those move to skrifa/harfrust.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via usvg/krilla; no maintained drop-in yet" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via usvg/krilla; no maintained drop-in yet" },
    # Unmaintained, no known vulnerability. Pulled in by serde_yaml_ng (the YAML form).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml_ng; no maintained drop-in yet" },
]

[licenses]
# Permissive licences only, compatible with shipping rhizo as MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# The GPU and font stacks pull in a few crates twice; report them, do not fail.
multiple-versions = "warn"
# The workspace's own crates are path dependencies without a version; cargo-deny only
# exempts those in crates marked `publish = false`. Set that (or versions) to tighten this.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
